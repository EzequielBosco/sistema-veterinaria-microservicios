# ms-duenio — configuracion local. En el Sprint 10 el datasource pasa al Config Server (config/ms-duenio.yml)
server:
  port: 8081

spring:
  application:
    name: ms-duenio
  datasource:
    url: jdbc:mysql://localhost:3306/duenio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
