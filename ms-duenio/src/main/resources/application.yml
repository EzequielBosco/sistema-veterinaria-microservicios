# ms-duenio — config local minima. Datasource, JPA, Eureka y Actuator vienen del Config Server
# (config-server/src/main/resources/config-repo/ms-duenio.yml + application.yml compartido)
server:
  port: 8081

spring:
  application:
    # Define que archivo pide al Config Server (ms-duenio.yml) y el nombre con el que se registra en Eureka
    name: ms-duenio
  config:
    import: "optional:configserver:http://localhost:8888"
