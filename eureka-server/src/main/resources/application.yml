# eureka-server — Service Discovery. Dashboard: http://localhost:8761
server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # El servidor no se registra a si mismo ni descarga el registro de otro Eureka
    register-with-eureka: false
    fetch-registry: false
  server:
    # En desarrollo: dar de baja rapido las instancias que se apagan
    enable-self-preservation: false
