# ms-mascota — configuracion local. En el Sprint 10 el datasource pasa al Config Server (config/ms-mascota.yml)
server:
  port: 8082

spring:
  application:
    name: ms-mascota
  datasource:
    url: jdbc:mysql://localhost:3306/mascota_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
