# ms-mascota — config local minima. Datasource, JPA, Eureka y Actuator vienen del Config Server
# (config-server/src/main/resources/config-repo/ms-mascota.yml + application.yml compartido)
server:
  port: 8082

spring:
  application:
    # Define que archivo pide al Config Server (ms-mascota.yml) y el nombre con el que se registra en Eureka
    name: ms-mascota
  config:
    import: "optional:configserver:http://localhost:8888"
