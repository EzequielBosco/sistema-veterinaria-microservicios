spring:
  datasource:
    url: jdbc:mysql://localhost:3306/turno_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# Timeouts y compresion de Feign: en el application.yml compartido (aplican a ms-turno y ms-mascota)

# Instancias de Resilience4j: los nombres coinciden con @CircuitBreaker/@Retry de los adaptadores Feign.
# Los parametros vienen de configs.default del application.yml compartido.
resilience4j:
  circuitbreaker:
    instances:
      mascotaService:
        base-config: default
      veterinarioService:
        base-config: default
  retry:
    instances:
      mascotaService:
        base-config: default
      veterinarioService:
        base-config: default

logging:
  level:
    # Loguea las llamadas a ms-mascota y ms-veterinario (requiere logger-level distinto de none)
    com.veterinaria.turno.adapter.out.feign: DEBUG

info:
  app:
    name: ms-turno
    description: Microservicio de gestion de turnos - Huellitas Perdidas
    version: 1.0.0
