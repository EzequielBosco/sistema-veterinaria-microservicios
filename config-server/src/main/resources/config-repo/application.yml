# Configuracion compartida por TODOS los microservicios.
# Cada ms-<servicio>.yml de esta carpeta la complementa (y tiene prioridad sobre este archivo).

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
  endpoint:
    health:
      show-details: always
  info:
    # Expone las propiedades info.* en /actuator/info
    env:
      enabled: true
