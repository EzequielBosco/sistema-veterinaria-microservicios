spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mascota_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

# Timeouts y compresion de Feign: en el application.yml compartido (aplican a ms-turno y ms-mascota)

# Instancias de Resilience4j del DuenioFeignAdapter (parametros de configs.default del application.yml compartido)
resilience4j:
  circuitbreaker:
    instances:
      duenioService:
        base-config: default
  retry:
    instances:
      duenioService:
        base-config: default

logging:
  level:
    # Loguea las llamadas a ms-duenio (requiere logger-level distinto de none)
    com.veterinaria.mascota.adapter.out.feign: DEBUG

info:
  app:
    name: ms-mascota
    description: Microservicio de gestion de mascotas - Huellitas Perdidas
    version: 1.0.0
