# ms-veterinario — config local minima. Datasource, JPA, Eureka y Actuator vienen del Config Server
# (config-server/src/main/resources/config-repo/ms-veterinario.yml + application.yml compartido)
server:
  port: 8083

spring:
  application:
    # Define que archivo pide al Config Server (ms-veterinario.yml) y el nombre con el que se registra en Eureka
    name: ms-veterinario
  config:
    import: "optional:configserver:http://localhost:8888"
