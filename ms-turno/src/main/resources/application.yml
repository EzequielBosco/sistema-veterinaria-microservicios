# ms-turno — configuracion local. En el Sprint 10 el datasource pasa al Config Server (config/ms-turno.yml)
server:
  port: 8084

spring:
  application:
    name: ms-turno
  datasource:
    url: jdbc:mysql://localhost:3306/turno_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
