# ms-turno — config local minima. Datasource, JPA, Eureka y Actuator vienen del Config Server
# (config-server/src/main/resources/config-repo/ms-turno.yml + application.yml compartido)
server:
  port: 8084

spring:
  application:
    # Define que archivo pide al Config Server (ms-turno.yml) y el nombre con el que se registra en Eureka
    name: ms-turno
  config:
    import: "optional:configserver:http://localhost:8888"
